[config]
schemaVersion = "0.0.1"

[package]
namespace = "Ab5oluteZer0"
name = "ProcessProgress"
# Nadpisywane numerem z tagu wydania przy publikacji (workflow thunderstore.yml).
versionNumber = "1.0.0"
description = "Progress bars with time left above growing plants, regrowing berries, fermenters and beehives."
websiteUrl = "https://github.com/Ab5oluteZer0/valheim-process-progress"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./dist"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
# "ai-generated": zasada Thunderstore dla paczek, ktorych kod powstal z pomoca AI.
valheim = ["mods", "utility", "client-side", "ai-generated"]
